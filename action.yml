name: Showtail verify
description: Verify the integrity of a sanitized, signed Showtail export.
author: Tingsters
branding:
  icon: check-circle
  color: purple
inputs:
  path:
    description: Directory containing report.html, report.md, manifest.json, and manifest.sig, relative to the workspace.
    required: false
    default: showtail-submission
  version:
    description: Showtail release tag, or latest. Pin a tag for a stable grading gate.
    required: false
    default: latest
  fail-on-invalid:
    description: Set to false to report an invalid submission without failing the step.
    required: false
    default: 'true'
outputs:
  ok:
    description: Whether the signature, file hashes, and residual scan passed.
    value: ${{ steps.verify.outputs.ok }}
  checks-json:
    description: The raw verify-submission JSON result.
    value: ${{ steps.verify.outputs.checks-json }}
runs:
  using: composite
  steps:
    - name: Install Showtail without capture
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        scratch="${RUNNER_TEMP:-${TMPDIR:-/tmp}}"
        bin_dir="$scratch/showtail-bin"
        mkdir -p "$bin_dir"
        export SHOWTAIL_DISABLE_FIRST_RUN=1
        export SHOWTAIL_HOME="$scratch/showtail-state"
        export PATH="$bin_dir:$PATH"
        export SHOWTAIL_BIN_DIR="$bin_dir"
        export SHOWTAIL_VERSION="$INPUT_VERSION"
        bash "$GITHUB_ACTION_PATH/install.sh"
        echo "$bin_dir" >> "$GITHUB_PATH"
        showtail --version
    - name: Verify signed export
      id: verify
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FAIL_ON_INVALID: ${{ inputs.fail-on-invalid }}
      run: |
        set -uo pipefail
        scratch="${RUNNER_TEMP:-${TMPDIR:-/tmp}}"
        export SHOWTAIL_HOME="$scratch/showtail-state"
        json="$scratch/showtail-verify.json"
        errlog="$scratch/showtail-verify.err"
        status=0
        showtail verify-submission "$INPUT_PATH" --json >"$json" 2>"$errlog" || status=$?
        ok=false
        if [ "$status" -eq 0 ]; then ok=true; fi
        {
          echo "ok=$ok"
          echo 'checks-json<<SHOWTAIL_JSON_EOF'
          cat "$json"
          echo 'SHOWTAIL_JSON_EOF'
        } >> "$GITHUB_OUTPUT"
        {
          echo '## Showtail submission verification'
          echo
          if [ "$ok" = true ]; then
            echo '**PASS: exported files are unchanged since signing.**'
          else
            echo '**FAIL: the submission did not verify.**'
          fi
          echo
          echo 'This checks integrity. It does not prove identity, authorship, or completeness.'
          echo
          echo '```json'
          cat "$json"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        if [ "$ok" = true ]; then exit 0; fi
        cat "$errlog" >&2
        case "$INPUT_FAIL_ON_INVALID" in
          false|0|no) exit 0 ;;
          *) exit 1 ;;
        esac
