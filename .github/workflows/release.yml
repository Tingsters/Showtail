name: Release

# Build standalone binaries for every platform and attach them to the GitHub
# Release when a version tag (e.g. v0.1.0) is pushed.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Gate the release on the same three-OS matrix CI uses, not a single Linux leg:
  # we ship a Windows binary and install.ps1, so a Windows-only regression must
  # block the tag rather than sail out in a release.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build all binaries
        run: bash scripts/build-all.sh

      - name: Build VS Code extension (VSIX)
        run: |
          cd integrations/vscode
          bun install
          bun run package
          cp showtail-*.vsix ../../dist/
          # Also publish under a STABLE name so the installer can fetch a fixed URL
          # (…/releases/latest/download/showtail.vsix) and drop it beside the binary —
          # this is what makes the VS Code / Antigravity IDE extension auto-install
          # hands-off (bundledVsixPath() finds it). See install.sh / bundledVsixPath().
          cp "$(ls -t showtail-*.vsix | head -1)" ../../dist/showtail.vsix

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/showtail-linux-x64
            dist/showtail-linux-arm64
            dist/showtail-darwin-x64
            dist/showtail-darwin-arm64
            dist/showtail-windows-x64.exe
            dist/showtail-*.vsix
            dist/showtail.vsix
          generate_release_notes: true
