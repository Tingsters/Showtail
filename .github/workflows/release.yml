name: Release

# Build standalone binaries for every platform and attach them to the GitHub
# Release when a version tag (e.g. v0.1.0) is pushed.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Build all binaries
        run: bash scripts/build-all.sh

      - name: Build VS Code extension (VSIX)
        run: |
          cd integrations/vscode
          bun install
          bun run package
          cp showtail-*.vsix ../../dist/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/showtail-linux-x64
            dist/showtail-darwin-x64
            dist/showtail-darwin-arm64
            dist/showtail-windows-x64.exe
            dist/showtail-*.vsix
          generate_release_notes: true
