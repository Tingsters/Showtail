name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Showtail ships binaries for Linux, macOS and Windows (plus install.ps1 and
    # Windows-specific path handling), so the gate has to run everywhere we ship.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Typecheck and formatting are platform-independent — running them on all
      # three legs would only triple the wall-clock cost of the gate.
      - name: Typecheck
        if: matrix.os == 'ubuntu-latest'
        run: bun run typecheck

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: bun run format:check

      - name: Check distributed licenses
        if: matrix.os == 'ubuntu-latest'
        run: bun run license:check

      - name: Run tests
        run: bun test

      - name: Check acceptance harness
        if: matrix.os == 'ubuntu-latest'
        run: bun x tsc --project scripts/acceptance/tsconfig.json

      - name: Run compiled CLI and browser acceptance tests
        if: matrix.os == 'ubuntu-latest'
        run: |
          bun build --compile ./src/cli.ts --outfile dist/acceptance/showtail
          bun x playwright install --with-deps chromium
          bun run test:acceptance --binary "$PWD/dist/acceptance/showtail"

      - name: Retain failed acceptance evidence
        if: failure() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: acceptance-evidence
          path: |
            dist/acceptance/**/*.json
            dist/acceptance/**/*.md
            dist/acceptance/**/*.html
            dist/acceptance/**/*.png
          if-no-files-found: ignore

      - name: Install VS Code extension dependencies
        if: matrix.os == 'ubuntu-latest'
        working-directory: integrations/vscode
        run: bun install --frozen-lockfile

      - name: Check VS Code extension
        if: matrix.os == 'ubuntu-latest'
        working-directory: integrations/vscode
        run: |
          bun run typecheck
          bun run test

      - name: Run VS Code 1.95 extension-host acceptance tests
        if: matrix.os == 'ubuntu-latest'
        working-directory: integrations/vscode
        run: xvfb-run -a bun run test:extension-host

      - name: Build and verify Windows release metadata
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          ./scripts/build-windows.ps1 -Version $version -OutputDirectory dist/signing-readiness

  report-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      SHOWTAIL_ACCEPTANCE_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun x playwright install --with-deps ${{ matrix.browser }}
      - name: All AI modes and visible feature parity
        run: bun run test:acceptance:parity dist/acceptance/public-report-audit/parity
      - name: Small report accessibility and visual scenarios
        if: success() || failure()
        run: bun run test:report:audit --fixture parity --artifact-dir dist/acceptance/public-report-audit/small
      - name: Complete large report and reading scenarios
        if: success() || failure()
        run: bun run test:report:audit --fixture large --artifact-dir dist/acceptance/public-report-audit/large
      - name: Empty report
        if: matrix.browser == 'chromium' && (success() || failure())
        run: bun run test:report:audit --fixture empty --artifact-dir dist/acceptance/public-report-audit/empty
      - name: Four-times CPU-throttled large report
        if: matrix.browser == 'chromium' && (success() || failure())
        env:
          SHOWTAIL_ACCEPTANCE_CPU_RATE: '4'
        run: bun run test:acceptance:large dist/acceptance/public-report-audit/throttled
      - name: Retain synthetic audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: report-audit-${{ matrix.browser }}
          path: dist/acceptance/public-report-audit/
          retention-days: 14
          if-no-files-found: warn
