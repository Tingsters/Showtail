name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Showtail ships binaries for Linux, macOS and Windows (plus install.ps1 and
    # Windows-specific path handling), so the gate has to run everywhere we ship.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Typecheck and formatting are platform-independent — running them on all
      # three legs would only triple the wall-clock cost of the gate.
      - name: Typecheck
        if: matrix.os == 'ubuntu-latest'
        run: bun run typecheck

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: bun run format:check

      - name: Check distributed licenses
        if: matrix.os == 'ubuntu-latest'
        run: bun run license:check

      - name: Run tests
        run: bun test

      - name: Build and verify Windows release metadata
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          ./scripts/build-windows.ps1 -Version $version -OutputDirectory dist/signing-readiness
