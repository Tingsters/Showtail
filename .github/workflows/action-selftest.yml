name: Action self-test

# Exercise the composite action with a signed export built from this checkout.
on:
  workflow_dispatch:
  push:
    paths:
      - "action.yml"
      - "install.sh"
      - ".github/workflows/action-selftest.yml"

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile

      - name: Build a signed fixture export
        env:
          SHOWTAIL_IDENTITY_EMAIL: student@example.com
          SHOWTAIL_IDENTITY_NAME: Test Student
        run: |
          set -euo pipefail
          export SHOWTAIL_HOME="$RUNNER_TEMP/showtail-fixture"
          mkdir -p fixture
          cd fixture
          printf 'def solve(items, cap):\n    return 0\n' > solver.py
          bun run ../src/cli.ts log -t prompt -x 'help me start a knapsack solver'
          bun run ../src/cli.ts artifact solver.py
          bun run ../src/cli.ts log -t prompt -x 'now add memoization'
          bun run ../src/cli.ts submit --all --no-sync --json > "$RUNNER_TEMP/export.json"
          export_dir="$(jq -r '.exportPath' "$RUNNER_TEMP/export.json")"
          cp -R "$export_dir" submission

      - name: A valid export passes
        id: valid
        uses: ./
        with:
          path: fixture/submission

      - name: Assert it reported ok
        env:
          RESULT_OK: ${{ steps.valid.outputs.ok }}
          RESULT_JSON: ${{ steps.valid.outputs.checks-json }}
        run: |
          set -euo pipefail
          test "$RESULT_OK" = true
          printf '%s' "$RESULT_JSON" | jq -e '.ok == true and (.problems | length) == 0' > /dev/null

      - name: Tamper with the signed HTML
        run: |
          set -euo pipefail
          printf '\nChanged after signing\n' >> fixture/submission/report.html

      - name: A tampered export is reported, not passed
        id: tampered
        uses: ./
        with:
          path: fixture/submission
          fail-on-invalid: "false"

      - name: Assert it reported the changed file
        env:
          RESULT_OK: ${{ steps.tampered.outputs.ok }}
          RESULT_JSON: ${{ steps.tampered.outputs.checks-json }}
        run: |
          set -euo pipefail
          test "$RESULT_OK" = false
          printf '%s' "$RESULT_JSON" | jq -e '.ok == false and any(.problems[]; contains("report.html was changed"))' > /dev/null
